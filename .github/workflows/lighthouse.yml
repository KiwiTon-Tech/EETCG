name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    name: Lighthouse Audit (${{ matrix.form-factor }})
    strategy:
      fail-fast: false
      matrix:
        form-factor: [desktop, mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Run Lighthouse CI (${{ matrix.form-factor }})
        run: npx lhci autorun --config=lighthouserc.${{ matrix.form-factor }}.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
